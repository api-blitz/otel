name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

# No stored secrets: the built-in GITHUB_TOKEN opens the "Version Packages" PR,
# and npm Trusted Publishing (OIDC) authenticates the publish.
permissions: {}

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version-file: ".node-version"
          cache: "pnpm"

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm type-check

      - name: Unit tests
        run: pnpm unit-test

  version:
    name: Version
    # The "Version Packages" PR is opened by GITHUB_TOKEN, and GitHub does not
    # start workflow runs for events it creates, so that PR never gets its own
    # unit-test/type-check run. Gate the release path here instead.
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write # push the changeset-release/main branch
      pull-requests: write # open/update the "Version Packages" PR
    outputs:
      has-changesets: ${{ steps.changesets.outputs.hasChangesets }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version-file: ".node-version"
          cache: "pnpm"

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Create or update the Version Packages PR
        id: changesets
        uses: changesets/action@v1
        with:
          version: pnpm version-packages
          commit: Version Packages
          title: Version Packages

  publish:
    name: Publish
    needs: [verify, version]
    # Runs once the Version Packages PR is merged (no changesets left). Packages
    # whose version is already on npm are skipped, so this is a no-op otherwise.
    if: github.ref == 'refs/heads/main' && needs.version.outputs.has-changesets == 'false'
    runs-on: ubuntu-latest
    # Must match the environment configured on each package's npm trusted publisher.
    environment:
      name: npm
      url: https://www.npmjs.com/org/api-blitz
    permissions:
      contents: write # push release tags + create GitHub releases
      id-token: write # OIDC token for npm Trusted Publishing (no stored token)
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "pnpm"

      # Trusted Publishing needs npm >= 11.5.1 (`pnpm publish` shells out to npm).
      # Pinned to 11: npm 12 changes `npm info --json` output that changesets
      # parses, and rejects the `--no-git-checks` flag pnpm passes through.
      - name: Install npm 11
        run: npm install -g npm@11

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Publish to npm
        uses: changesets/action@v1
        with:
          publish: pnpm release
          createGithubReleases: true
